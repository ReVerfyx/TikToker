language: "ru"

youtube:
  check_every_seconds: 3600
  search_results: 20
  min_duration_seconds: 60
  max_duration_seconds: 10800
  source_mode: "both" # search | channels | both
  queries:
    - "анимация"
    - "Minecraft"
    - "космос"
    - "ремонт телефона"
  channels:
    # Добавляй URL каналов/источников, на публикацию которых у тебя есть право.
    # - "https://www.youtube.com/@example"

processing:
  part_seconds: 300
  mode: "vertical_blur" # vertical_blur | original
  width: 1080
  height: 1920
  crf: 23
  preset: "veryfast"
  audio_bitrate: "128k"

captions:
  source_credit: true
  source_template: "Источник: YouTube — {channel}"
  max_hashtags: 8

ai:
  enabled: false
  provider: "gemini"
  api_key: ""
  model: "gemini-3.5-flash-lite"

tiktok:
  upload_delay_seconds: 60
  headless: true
  browser: "chromium"
  account_strategy: "per_video" # per_video | per_part
  accounts:
    # Аккаунтов может быть сколько угодно.
    - name: "account1"
      cookies: "cookies/account1.txt"
    - name: "account2"
      cookies: "cookies/account2.txt"
    - name: "account3"
      cookies: "cookies/account3.txt"

storage:
  work_dir: "data/work"
  database: "data/tiktoker.db"
  delete_after_success: true
