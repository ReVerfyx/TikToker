language: "ru"

youtube:
  check_every_seconds: 3600

  # Если VPS получает "Sign in to confirm you're not a bot",
  # положи Netscape cookies сюда. Файл исключён из Git.
  cookies_file: "youtube_cookies.txt"

  # Небольшая пауза между запросами yt-dlp.
  sleep_requests: 2
  search_results: 20
  min_duration_seconds: 60
  max_duration_seconds: 10800
  source_mode: "both" # search | channels | both
  queries:
    - "анимация"
    - "Minecraft"
    - "космос"
    - "ремонт телефона"
  channels: []
  # Добавляй URL каналов/источников, на публикацию которых у тебя есть право.
  # Пример:
  # channels:
  #   - "https://www.youtube.com/@example"

processing:
  part_seconds: 300
  mode: "vertical_blur" # vertical_blur | original
  width: 1080
  height: 1920
  crf: 23
  preset: "veryfast"
  audio_bitrate: "128k"

captions:
  source_credit: true
  source_template: "Источник: YouTube — {channel}"
  required_hashtags:
    - "fyp"
    - "рек"
    - "рекомендации"
  max_auto_hashtags: 7

tiktok:
  # Автоматически подхватывает любое число cookies/account*.txt
  auto_discover_cookies: true
  cookies_dir: "cookies"

  # Реестр создаёт accounts.py.
  accounts_registry: "data/accounts.json"

  # true = без свежей проверки приватности аккаунты не используются.
  require_account_scan: true
  upload_delay_seconds: 60
  headless: true
  browser: "chromium"
  account_strategy: "per_video" # per_video | per_part
  accounts: []
  # Если auto_discover_cookies: false, можно перечислить файлы вручную.

storage:
  work_dir: "data/work"
  database: "data/tiktoker.db"
  delete_after_success: true
